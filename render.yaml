services:
  - type: web
    name: cuadrocorrocalle-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npx --yes pnpm@12.8.1 install --frozen-lockfile && npx --yes pnpm@12.8.1 --filter @cuadrocorrocalle/api db:deploy
    startCommand: cd apps/api && node --import tsx src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: PROXY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://cuadrocorrocalle.pages.dev
